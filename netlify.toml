[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Local development — an explicit, fixed vite port, otherwise netlify dev can
# "adopt" another project's vite server already running on the default port 5173
#
# vite is launched through node directly and not through npx: netlify waits for
# the port for 20 attempts only (~15 seconds, lib/wait-port.js) and then fails
# with "Timed out waiting for port". npx adds a few seconds and two process layers
# (npx → cmd → node) — on a cold run that blows the budget, netlify dies, and the
# vite born after it is orphaned and holds the port.
[dev]
  command = "node node_modules/vite/bin/vite.js --port 5199 --strictPort"
  targetPort = 5199
  port = 8888
  framework = "#custom"

# SPA — every path is served from index.html
# (/.netlify/functions/* paths are handled before the redirect and are not swallowed by it)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
