[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# פיתוח מקומי — פורט vite קבוע ומפורש, אחרת netlify dev עלול "לאמץ"
# שרת vite של פרויקט אחר שכבר רץ על פורט ברירת-המחדל 5173
#
# vite מורץ ישירות דרך node ולא דרך npx: netlify מחכה לפורט 20 ניסיונות
# בלבד (~15 שניות, ‎lib/wait-port.js‎) ואז נכשל ב-"Timed out waiting for port".
# npx מוסיף כמה שניות ושתי שכבות תהליך (‎npx → cmd → node‎) — בהרצה קרה זה
# חוצה את התקציב, netlify מת, ו-vite שנולד אחריו נשאר יתום ותופס את הפורט.
[dev]
  command = "node node_modules/vite/bin/vite.js --port 5199 --strictPort"
  targetPort = 5199
  port = 8888
  framework = "#custom"

# SPA — כל נתיב מוגש מ-index.html
# (נתיבי ‎/.netlify/functions/*‎ מטופלים לפני ה-redirect ולא נבלעים בו)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
